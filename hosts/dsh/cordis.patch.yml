# Repo Tutor 的 DSH 层，两条声明：
#
#   1) host 行 —— 插件本体：11 个 tutor_* 工具、一节教学 prompt、/tutor 命令。
#      它挂在 profile 的全局作用域里，所以标准模式下也能调用这些工具（只是不会
#      自动变成教学会话）。
#
#   2) preset 行 —— 导师模式。DSH 0.2 起 agent preset 只能由 bundle 里的
#      `@deepseek-ai/dsh-agent-preset` 行声明；`$DSH_HOME/.agent-presets/<id>/`
#      那套目录式 preset 已经没有任何代码去读了。
#
# preset 里的插件行按「声明它的那棵组合」的解析基准解析（mountPreset 把
# record.context.baseUrl 传下去），也就是用户 profile 的目录，所以这里写包名
# 就够了 —— 别写相对路径，`./src/index.js` 会解析成 <profile>/src/index.js。
#
# 与 standard 的差别就是这份 plugins 清单：这里**故意不装**文件系统工具、shell、
# 网页、子代理、skill、goal、plan-mode。导师看代码只能走 tutor_evidence_read，
# 于是"证据预算"和"冻结快照"才是真的，模型没有别的门路绕过去。
- insert:
    - id: repo-tutor
      name: repo-tutor-dsh

    - id: preset-repo-tutor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: repo-tutor
        name: 导师模式
        description: 只做教学，不改你的代码：按 Learning Unit 逐个机制带你读懂仓库，读代码走证据预算，出题用提问卡，判题只认提问那一刻冻结的证据。
        order: 5
        plugins:
          # 语气和身份：这里是"教"不是"替你做"。{{model}} 由 agent 自己的路由解析；
          # 别写 {{cwd}} —— 0.2.x 只注册 provider / model 两个变量，插值又是严格的，
          # 写一个不存在的变量会让整轮在组装系统提示时直接报错。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a repository tutor powered by the {{model}} model. The user is learning this
                codebase and you are the teacher: your job is to make them able to read, debug and
                change it themselves. A request to fix or change code is still a teaching request —
                explain and guide, do not hand over a patch.
              suffix: >-
                The repository under study is the one this session works in. Teach in the user's
                language, by guided reading of real code.

          # C++ Core 的 DSH adapter：11 个 tutor_* 工具 + 教学 prompt 小节 + /tutor 命令。
          # 不发布 service，所以不需要 isolate realm。
          # alwaysOn: true 让 prompt 从"用户想学的时候你可以教"变成"这个会话就是教学会话"；
          # blockBypassTools: true 把宿主全局注册的「读文件 / 执行命令 / 上网 / 派子代理」
          # 从导师 agent 上摘掉，证据预算在任何组合下都堵得住。
          # Core 不在这里写死路径：插件自己按 optionalDependencies 找当前平台的平台包。
          - id: repo-tutor
            name: repo-tutor-dsh
            config:
              alwaysOn: true
              blockBypassTools: true

          # 提问卡：确认学习地图、确认起点、出理解检查都靠它。
          # 没有这个，题目只能埋在正文末尾，学习者拿不到输入框。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # 长会话要能压缩。`compaction-basic` 通过 ctx.get 读 `toolResultPrune`，
          # 所以 pruner 必须和它同一个 realm，不能放在外面。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
